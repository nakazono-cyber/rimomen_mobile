<title>点検判断ツール</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Share+Tech+Mono&display=swap');
:root{
  --bg:#f0f3f8;--surface:#fff;--border:#e2e8f0;
  --danger:#d92b2b;--danger-bg:#fff0f0;--danger-br:#ffc5c5;
  --warn:#d97706;--warn-bg:#fffbeb;--warn-br:#fde68a;
  --accent:#1d6fd8;
  --text:#111827;--text-muted:#64748b;--text-dim:#94a3b8;
  --sans:'Noto Sans JP',sans-serif;--mono:'Share Tech Mono',monospace;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-top:env(safe-area-inset-top,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--text);overflow:hidden;overscroll-behavior:none;}
.header{position:fixed;top:0;left:0;right:0;z-index:400;background:var(--surface);border-bottom:1px solid var(--border);padding:calc(var(--safe-top)+10px) 14px 10px;box-shadow:0 2px 12px rgba(0,0,0,.08);}
.header-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.logo{display:flex;align-items:center;gap:9px;}
.logo-icon{width:34px;height:34px;background:#009944;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;}
.logo-title{font-size:14px;font-weight:900;}
.logo-sub{font-size:9px;color:var(--text-muted);font-family:var(--mono);}
.btn-csv{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:700;font-family:var(--sans);cursor:pointer;}
.stats-row{display:flex;gap:6px;}
.stat-pill{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 10px;border-radius:10px;font-size:13px;font-weight:700;font-family:var(--mono);}
.stat-pill.danger{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-br);}
.stat-pill.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-br);}
.stat-dot{width:8px;height:8px;border-radius:50%;}
.stat-pill.danger .stat-dot{background:var(--danger);}
.stat-pill.warn .stat-dot{background:var(--warn);}
.stat-label{font-size:11px;font-weight:400;font-family:var(--sans);opacity:.8;}
.screen{position:fixed;top:0;left:0;right:0;bottom:0;display:none;}
.screen.active{display:block;}
#screen-map{background:#f4f6fb;overflow:hidden;}
.map-viewport{width:100%;height:100%;overflow:hidden;position:relative;cursor:grab;touch-action:none;}
.map-viewport.grabbing{cursor:grabbing;}
.map-canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;}
.map-legend{position:absolute;bottom:0;left:0;right:0;z-index:10;padding:6px 10px calc(var(--safe-bottom)+62px);background:linear-gradient(transparent,rgba(244,246,251,.97) 30%);pointer-events:none;}
.legend-inner{display:flex;flex-wrap:wrap;gap:4px 10px;}
.legend-item{display:flex;align-items:center;gap:4px;font-size:9px;font-weight:700;color:#444;}
.legend-line{width:18px;height:4px;border-radius:2px;flex-shrink:0;}
#screen-list{background:var(--bg);}
.screen-inner{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.list-controls{padding:10px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface);border-bottom:1px solid var(--border);}
.search-box{display:flex;align-items:center;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:0 12px;gap:8px;}
.search-box input{flex:1;border:none;background:transparent;padding:9px 0;font-size:14px;font-family:var(--sans);color:var(--text);outline:none;}
.search-box input::placeholder{color:var(--text-dim);}
.filter-row{display:flex;gap:6px;}
.filter-chip{flex:1;padding:6px 8px;border-radius:8px;border:1.5px solid var(--border);background:transparent;font-size:12px;font-weight:700;font-family:var(--sans);color:var(--text-muted);cursor:pointer;text-align:center;-webkit-appearance:none;}
.filter-chip.active-all{background:var(--accent);border-color:var(--accent);color:#fff;}
.filter-chip.active-danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.filter-chip.active-warn{background:var(--warn);border-color:var(--warn);color:#fff;}
.station-cards{padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
.station-card{background:var(--surface);border-radius:14px;border:1px solid var(--border);overflow:hidden;cursor:pointer;width:100%;text-align:left;font-family:var(--sans);-webkit-appearance:none;transition:transform .1s;}
.station-card:active{transform:scale(.985);}
.card-main{display:flex;align-items:center;padding:14px;gap:12px;}
.card-sym{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;font-family:var(--mono);flex-shrink:0;}
.card-sym.danger{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-br);}
.card-sym.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-br);}
.card-body{flex:1;min-width:0;}
.card-name{font-size:16px;font-weight:900;}
.card-sub{font-size:12px;color:var(--text-muted);margin-top:2px;font-family:var(--mono);}
.card-count{font-size:26px;font-weight:900;font-family:var(--mono);flex-shrink:0;}
.card-count.danger{color:var(--danger);}
.card-count.warn{color:var(--warn);}
.card-count-label{font-size:10px;font-family:var(--sans);}
.card-faults{padding:0 14px 12px;display:flex;flex-direction:column;gap:6px;}
.fault-chip{background:var(--bg);border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:flex-start;}
.fault-chip-sym{font-size:11px;font-weight:900;font-family:var(--mono);padding:1px 6px;border-radius:4px;flex-shrink:0;margin-top:1px;}
.fault-chip-sym.danger{background:var(--danger);color:#fff;}
.fault-chip-sym.warn{background:var(--warn);color:#fff;}
.fault-chip-body{flex:1;min-width:0;}
.fault-chip-gate{font-size:12px;font-weight:700;font-family:var(--mono);color:var(--accent);margin-bottom:3px;display:flex;align-items:center;gap:6px;}
.fault-chip-model{font-size:10px;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--text-muted);}
.fault-chip-corner{font-size:10px;color:var(--text-muted);}
.fault-chip-reason{font-size:12px;color:var(--text);line-height:1.55;}
.fault-chip-date{font-size:10px;color:var(--text-muted);font-family:var(--mono);margin-top:4px;}
.fault-chip-date.no-date{color:var(--danger);}
.no-data-msg{padding:48px 20px;text-align:center;color:var(--text-muted);font-size:14px;line-height:2;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:400;background:var(--surface);border-top:1px solid var(--border);display:flex;padding-bottom:var(--safe-bottom);box-shadow:0 -3px 16px rgba(0,0,0,.07);}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px 8px;gap:3px;cursor:pointer;border:none;background:transparent;font-family:var(--sans);color:var(--text-dim);font-size:10px;font-weight:500;-webkit-appearance:none;}
.nav-tab.active{color:var(--accent);}
.nav-tab-icon{font-size:22px;line-height:1;}
.sheet-backdrop{display:none!important;}
.sheet-backdrop.open{display:block;}
.bottom-sheet{position:fixed;left:0;right:0;top:0;bottom:0;z-index:500;background:var(--surface);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s ease;}
.bottom-sheet.open{transform:translateY(0);}
.sheet-handle{display:none;}
.sheet-header{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-top) + 14px) 18px 14px;border-bottom:2px solid var(--border);flex-shrink:0;}
.sheet-title{font-size:20px;font-weight:900;}
.sheet-meta{font-size:12px;color:var(--text-muted);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.sheet-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;font-family:var(--mono);}
.sheet-badge.danger{background:var(--danger);color:#fff;}
.sheet-badge.warn{background:var(--warn);color:#fff;}
.sheet-close{background:var(--danger);border:none;border-radius:10px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;color:white;flex-shrink:0;}
.sheet-body{overflow-y:scroll;-webkit-overflow-scrolling:touch;flex:1;padding:12px 14px calc(var(--safe-bottom)+16px);display:flex;flex-direction:column;gap:8px;min-height:0;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:20px 20px 0 0;padding:20px 20px calc(var(--safe-bottom)+20px);width:100%;}
.modal h2{font-size:16px;font-weight:900;margin-bottom:6px;}
.modal p{font-size:12px;color:var(--text-muted);margin-bottom:14px;line-height:1.7;}
.col-format{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:11px;font-family:var(--mono);color:var(--text-muted);margin-bottom:14px;line-height:1.9;}
.drop-zone{border:2px dashed var(--border);border-radius:14px;padding:28px 20px;text-align:center;cursor:pointer;background:var(--bg);margin-bottom:14px;}
.drop-zone-icon{font-size:36px;margin-bottom:6px;}
.drop-zone-text{font-size:13px;color:var(--text-muted);}
.modal-actions{display:flex;flex-direction:column;gap:8px;}
.btn-full{width:100%;padding:14px;border-radius:12px;font-size:14px;font-weight:700;font-family:var(--sans);cursor:pointer;-webkit-appearance:none;}
.btn-full.primary{background:var(--accent);color:#fff;border:none;}
.btn-full.secondary{background:transparent;border:1.5px solid var(--border);color:var(--text-muted);}
.token-modal{background:var(--surface);border-radius:20px 20px 0 0;padding:24px 20px calc(var(--safe-bottom)+24px);width:100%);}
.token-input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:12px;font-family:var(--mono);color:var(--text);background:var(--bg);outline:none;margin-bottom:10px;word-break:break-all;}
.token-input:focus{border-color:var(--accent);}

.sp-modal{background:var(--surface);border-radius:20px 20px 0 0;padding:20px 20px calc(var(--safe-bottom)+20px);width:100%;max-height:90vh;overflow-y:auto;}
.sp-input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:var(--sans);color:var(--text);background:var(--bg);outline:none;margin-bottom:10px;}
.sp-input:focus{border-color:var(--accent);}
.sp-status{font-size:12px;padding:8px 12px;border-radius:8px;margin-bottom:10px;display:none;}
.sp-status.loading{background:#e8f0fe;color:var(--accent);display:block;}
.sp-status.error{background:var(--danger-bg);color:var(--danger);display:block;}
.sp-status.success{background:#f0fdf4;color:#166534;display:block;}
</style>
</head>

  try{

async function fetchGitHubCsv(){
  const today = getTodayStr();
  const fileName = `${today}_rimomen_mobile.csv`;
  const url = `${GITHUB_RAW}/${fileName}`;

  const sub = document.querySelector('.logo-sub');
  if(sub) sub.textContent = '📥 データ取得中...';

  try{
    const resp = await fetch(url, {cache:'no-store'});
    if(resp.ok){
      const text = await resp.text();
      if(text && text.trim().length > 10){
        loadData(text);
        return;
      }
    }
    // 取得失敗→空の状態で起動
    if(sub) sub.textContent = 'GATE INSPECTION MAP';
  }catch(e){
    console.log('GitHub取得失敗:', e.message);
    if(sub) sub.textContent = 'GATE INSPECTION MAP';
  }
}

function fitMap(){
  const vp=document.getElementById('mapViewport');
  const vpW=vp.clientWidth, vpH=vp.clientHeight;
  scale=Math.min(vpW/SVG_W,vpH/SVG_H)*0.95;
  panX=(vpW-SVG_W*scale)/2; panY=(vpH-SVG_H*scale)/2;
  applyT();
}

function applyT(){
  document.getElementById('mapCanvas').style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;
}

function setupInteraction(){
  const vp=document.getElementById('mapViewport');
  vp.addEventListener('touchstart',onTS,{passive:false});
  vp.addEventListener('touchmove',onTM,{passive:false});
  vp.addEventListener('touchend',onTE,{passive:false});
  vp.addEventListener('mousedown',e=>{isPanning=true;startPan={x:e.clientX,y:e.clientY};startPos={x:panX,y:panY};vp.classList.add('grabbing');});
  window.addEventListener('mousemove',e=>{if(!isPanning)return;panX=startPos.x+(e.clientX-startPan.x);panY=startPos.y+(e.clientY-startPan.y);applyT();});
  window.addEventListener('mouseup',()=>{isPanning=false;document.getElementById('mapViewport').classList.remove('grabbing');});
  vp.addEventListener('wheel',e=>{e.preventDefault();doZoom(e.deltaY>0?0.9:1.1,e.clientX,e.clientY);},{passive:false});
  vp.addEventListener('click',e=>{
    const t=e.target.closest('.st');
    if(t){onStationClick(t.getAttribute('data-name'));}else closeSheet();
  });
}
function onTS(e){
  if(e.touches.length===1){isPanning=true;lastTouch={x:e.touches[0].clientX,y:e.touches[0].clientY};startPos={x:panX,y:panY};lastDist=null;}
  else if(e.touches.length===2){isPanning=false;lastDist=d2(e);lastTouch=m2(e);}
}
function onTM(e){
  e.preventDefault();
  if(e.touches.length===1&&isPanning&&lastTouch){
    panX+=e.touches[0].clientX-lastTouch.x;panY+=e.touches[0].clientY-lastTouch.y;
    lastTouch={x:e.touches[0].clientX,y:e.touches[0].clientY};applyT();
  }else if(e.touches.length===2&&lastDist){
    const d=d2(e),m=m2(e);doZoom(d/lastDist,m.x,m.y);lastDist=d;lastTouch=m;
  }
}
function onTE(e){if(e.touches.length===0){isPanning=false;lastDist=null;}}
function d2(e){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;return Math.sqrt(dx*dx+dy*dy);}
function m2(e){return{x:(e.touches[0].clientX+e.touches[1].clientX)/2,y:(e.touches[0].clientY+e.touches[1].clientY)/2};}
function doZoom(delta,cx,cy){
  const ns=Math.max(0.3,Math.min(6,scale*delta));
  const vp=document.getElementById('mapViewport'),r=vp.getBoundingClientRect();
  const ox=cx-r.left,oy=cy-r.top;
  panX=ox-(ox-panX)*(ns/scale);panY=oy-(oy-panY)*(ns/scale);scale=ns;applyT();
}

// 駅名・管区名の名寄せ
function normalizeName(name){
  name = (name||'').trim();
  const map = {
    // 半角カナ・略称
    '南町田ｸﾞﾗﾝ':              '南町田グランベリーパーク',
    '南町田グラン':              '南町田グランベリーパーク',
    '南町田ｸﾞﾗﾝﾍﾞﾘｰﾊﾟｰｸ':      '南町田グランベリーパーク',
    // みなとみらい線
    '元町・中華街':              '元町・中華街',
    '元町・中華街駅':            '元町・中華街',
  };
  // 半角カナを全角に変換してから照合
  const zen = name.replace(/[｡-ﾟ]/g, c => {
    const k = '｡｢｣､･ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜｦﾝ';
    const z = '。「」、・ヲァィゥェォャュョッーアイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
    const i = k.indexOf(c);
    return i >= 0 ? z[i] : c;
  });
  // 濁点・半濁点の合成
  const dakuten = zen.replace(/([ｳｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾊﾋﾌﾍﾎアイウエオカキクケコサシスセソタチツテトハヒフヘホ])(ﾞ|゛)/g, (m, c) => {
    const d = 'ウカキクケコサシスセソタチツテトハヒフヘホ';
    const D = 'ヴガギグゲゴザジズゼゾダヂヅデドバビブベボ';
    const i = d.indexOf(c); return i >= 0 ? D[i] : m;
  }).replace(/([ﾊﾋﾌﾍﾎハヒフヘホ])(ﾟ|゜)/g, (m, c) => {
    const p = 'ハヒフヘホ'; const P = 'パピプペポ';
    const i = p.indexOf(c); return i >= 0 ? P[i] : m;
  });
  if (map[name]) return map[name];
  if (map[dakuten]) return map[dakuten];
  // 南町田系の部分一致
  if (name.includes('南町田') || dakuten.includes('南町田')) return '南町田グランベリーパーク';
  return name;
}
function normalizeKanku(k){
  k = (k||'').trim();
  const map = {
    'ＭＭ線':    'みなとみらい線',
    'MM線':      'みなとみらい線',
    'みなとみらい線': 'みなとみらい線',

    '田園都市線': '田園都市線',
    '池上線':    '池上線',
    '目黒線':    '目黒線',
  };
  return map[k] || k;
}
function buildStations(rows){
  const st={};
  for(const row of rows){
    const name=normalizeName(row['駅']);
    const status=(row['機器状態']||'').trim();
    if(!name)continue;
    const kanku=normalizeKanku(row['管区']);
    if(!st[name])st[name]={name,kanku,severity:'warn',faults:[]};
    if(status==='×')st[name].severity='danger';
    st[name].faults.push({status,corner:(row['コーナ']||'').trim(),model:(row['機種']||'').trim(),
      gate:(row['号機']||'').trim(),reason:(row['要点検・点検予告理由']||'').trim(),date:(row['最終点検日']||'').trim()});
  }
  return st;
}
function loadData(csv){
  const r=Papa.parse(csv,{header:true,skipEmptyLines:true,transformHeader:h=>h.trim().replace(/^"|"$/g,'').replace(/^\uFEFF/,'')});

  updateStats();updateMarkers();renderList();closeModal();

function buildFaultChip(f){
  const fd=f.status==='×'?'danger':'warn',sym=f.status==='×'?'×':'△';
  const reasons=f.reason.split(/　+/).filter(Boolean);
  const rhtml=reasons.length>1?reasons.map(r=>`<div>・${r}</div>`).join(''):(f.reason||'―');
  const dhtml=f.date?`<div class="fault-chip-date">📅 ${f.date}</div>`:`<div class="fault-chip-date no-date">📅 点検記録なし</div>`;
  const corner=f.corner?`<span class="fault-chip-corner">[${f.corner}]</span>`:'';
  return `<div class="fault-chip"><div class="fault-chip-sym ${fd}">${sym}</div>
    <div class="fault-chip-body">
      <div class="fault-chip-gate">${f.gate}号機 ${corner}<span class="fault-chip-model">${f.model}</span></div>
      <div class="fault-chip-reason">${rhtml}</div>${dhtml}
    </div></div>`;
}
function renderList(){
  const q=(document.getElementById('searchInput')?.value||'').trim();
  const cards=document.getElementById('stationCards');
  const vis=Object.entries(stations).filter(([n,i])=>{
    if(currentFilter==='danger'&&i.severity!=='danger')return false;
    if(currentFilter==='warn'&&i.severity!=='warn')return false;
    if(q&&!n.includes(q)&&!i.kanku.includes(q))return false;
    return true;
  });
  vis.sort(([,a],[,b])=>{const sa=a.severity==='danger'?0:1,sb=b.severity==='danger'?0:1;return sa!==sb?sa-sb:b.faults.length-a.faults.length;});
  if(!vis.length){cards.innerHTML='<div class="no-data-msg">🔍 該当する駅がありません</div>';return;}
  cards.innerHTML=vis.map(([name,info])=>{
    const isDanger=info.severity==='danger',cls=isDanger?'danger':'warn',sym=isDanger?'×':'△';

const GITHUB_REPO = 'nakazono-cyber/rimomen_mobile';
const GITHUB_API = 'https://api.github.com';
function getToken(){ return localStorage.getItem('githubToken')||''; }

// CSVをGitHubにアップロード
async function uploadCsvToGitHub(csvText){
  const today = getTodayStr();
  const fileName = `${today}_rimomen_mobile.csv`;
  const path = fileName;

  // 既存ファイルのSHAを取得（上書きに必要）
  let sha = null;
  try{
    const checkResp = await fetch(`${GITHUB_API}/repos/${GITHUB_REPO}/contents/${path}`,{
      headers:{
        'Authorization': `Bearer ${getToken()}`,
        'Accept': 'application/vnd.github+json'
      }
    });
    if(checkResp.ok){
      const data = await checkResp.json();
      sha = data.sha;
    }
  }catch(e){}

  // Base64エンコード
  const encoded = btoa(unescape(encodeURIComponent(csvText)));

  // アップロード
  const body = {
    message: `${today} 点検データ更新`,
    content: encoded,
    ...(sha ? {sha} : {})
  };

  const resp = await fetch(`${GITHUB_API}/repos/${GITHUB_REPO}/contents/${path}`,{
    method: 'PUT',
    headers:{
      'Authorization': `Bearer ${getToken()}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });

  return resp.ok;
}

function openModal(){
  // トークン未設定なら先に設定を促す
  if(!getToken()){
    openTokenModal();
    return;
  }
  document.getElementById('modalOverlay').classList.add('open');
}
function openTokenModal(){
  const saved = getToken();
  if(saved) document.getElementById('tokenInput').value = saved;
  document.getElementById('tokenModalOverlay').classList.add('open');
}
function closeTokenModal(){
  document.getElementById('tokenModalOverlay').classList.remove('open');
}
function saveToken(){
  const token = document.getElementById('tokenInput').value.trim();
  if(!token){ alert('トークンを入力してください'); return; }
  localStorage.setItem('githubToken', token);
  closeTokenModal();
  // トークン設定後にCSV読込モーダルを開く
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');}
</script>
</body>
</html>
