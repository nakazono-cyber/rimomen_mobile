<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リスクアセスメント表 作成ツール</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --navy:#1c2b3a;
    --navy-light:#2c4257;
    --accent:#d97b3f;
    --accent-dark:#b8622c;
    --bg:#f3f1ec;
    --card:#ffffff;
    --line:#dcd7cc;
    --text:#232323;
    --sub:#6b6459;
    --yes:#3e7d5a;
    --no:#a9433a;
    --unk:#c79a2e;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Hiragino Sans","Yu Gothic",sans-serif;
    background:var(--bg); color:var(--text); padding-bottom:40px;
  }
  header{
    background:var(--navy); color:#fff; padding:18px 16px 16px;
    position:sticky; top:0; z-index:10;
  }
  header h1{ font-size:16px; margin:0 0 4px; font-weight:600; letter-spacing:.02em;}
  header .sub{font-size:11px; color:#b7c2cc;}
  .progress-wrap{ height:4px; background:#0e1a24; margin-top:10px; border-radius:2px; overflow:hidden;}
  .progress-bar{ height:100%; background:var(--accent); width:0%; transition:width .3s;}
  main{ max-width:640px; margin:0 auto; padding:16px;}
  @media (min-width:900px){
    main{ max-width:900px; }
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; margin-bottom:14px;
  }
  .step-title{ font-size:13px; color:var(--sub); margin-bottom:4px; }
  .q-phase-tag{
    display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px;
    background:var(--navy-light); color:#fff; margin-bottom:10px;
  }
  .q-text{ font-size:18px; line-height:1.5; font-weight:600; margin:6px 0 20px;}
  label{ display:block; font-size:12px; color:var(--sub); margin:12px 0 4px;}
  input[type=text], input[type=date], textarea, select{
    width:100%; padding:10px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; font-family:inherit; background:#fff;
  }
  textarea{ resize:vertical; min-height:44px;}
  .btn{
    display:inline-block; padding:12px 18px; border-radius:8px; border:none;
    font-size:14px; font-weight:600; cursor:pointer; text-align:center;
  }
  .btn-primary{ background:var(--accent); color:#fff; width:100%; padding:14px;}
  .btn-primary:active{ background:var(--accent-dark); }
  .btn-ghost{ background:none; border:1px solid var(--line); color:var(--sub); }
  .btn-row{ display:flex; gap:10px; margin-top:6px;}
  .answer-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .ans-btn{
    padding:16px 6px; border-radius:10px; border:2px solid var(--line); background:#fff;
    font-size:14px; font-weight:700; cursor:pointer; color:var(--text);
  }
  .ans-yes{ border-color:var(--yes); color:var(--yes);}
  .ans-no{ border-color:var(--no); color:var(--no);}
  .ans-unk{ border-color:var(--unk); color:#8a6d1f;}
  .ans-yes:active, .ans-yes.active{ background:var(--yes); color:#fff;}
  .ans-no:active, .ans-no.active{ background:var(--no); color:#fff;}
  .ans-unk:active, .ans-unk.active{ background:var(--unk); color:#fff;}
  .phase-check{
    display:flex; align-items:center; gap:10px; padding:12px; border:1px solid var(--line);
    border-radius:8px; margin-bottom:10px;
  }
  .phase-check input{ width:20px; height:20px;}
  .item-card{
    border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; background:#fbfaf7;
  }
  .item-card.checked{ border-color:var(--accent); background:#fff8f2;}
  .item-head{ display:flex; align-items:flex-start; gap:10px; }
  .item-head input[type=checkbox]{ width:20px; height:20px; margin-top:2px; flex-shrink:0;}
  .item-risk{ font-size:14px; font-weight:600; line-height:1.4;}
  .item-detail{ font-size:12px; color:var(--sub); margin-top:6px; line-height:1.5;}
  .item-edit{ margin-top:10px; display:none; }
  .item-card.checked .item-edit{ display:block; }
  .level-row{ display:flex; gap:8px; margin-top:8px;}
  .level-row select{ font-size:12px; padding:6px;}
  .level-badge{
    display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:700;
    color:#fff; margin-left:6px;
  }
  .lvl-I{background:#7a9e7a;} .lvl-II{background:#5a8fb0;} .lvl-III{background:#d99a3f;} .lvl-IV{background:#c0503f;}
  .cat-section-title{
    font-size:15px; font-weight:700; margin:22px 0 10px; padding-bottom:6px; border-bottom:2px solid var(--navy);
  }
  .phase-title{ font-size:17px; font-weight:800; margin:26px 0 4px; color:var(--navy);}
  .small-note{ font-size:12px; color:var(--sub); margin-top:4px;}
  .add-custom{ margin-top:8px; }
  .summary-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--line); font-size:13px;}
  .footer-nav{ display:flex; gap:10px; margin-top:18px;}
  .footer-nav .btn-ghost{ flex:0 0 auto;}
  .footer-nav .btn-primary{ flex:1;}
  .qcounter{ font-size:12px; color:var(--sub); margin-bottom:2px;}
  .warn-box{ background:#fff4e5; border:1px solid #f0cf9a; border-radius:8px; padding:10px 12px; font-size:12px; color:#8a5a1f; margin-bottom:14px;}
  .count-bar{
    position:sticky; top:0; z-index:9;
    display:flex; gap:8px; flex-wrap:wrap;
    background:var(--navy); color:#fff; border-radius:10px;
    padding:10px 14px; margin-bottom:14px; font-size:13px;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
  }
  .count-bar .cnt{ display:flex; align-items:center; gap:5px; }
  .count-bar .cnt b{ color:#ffc98a; font-size:16px; }
  .count-bar .cnt + .cnt{ margin-left:4px; padding-left:12px; border-left:1px solid rgba(255,255,255,.25); }
  .cat-count{
    display:inline-block; margin-left:6px; padding:1px 8px; border-radius:12px;
    font-size:11px; font-weight:700; background:#eee5d6; color:#6b6459; vertical-align:middle;
  }
  .cat-count.has{ background:var(--accent); color:#fff; }
  .phase-columns{ display:flex; flex-direction:column; gap:16px; }
  @media (min-width:900px){
    .phase-columns{ display:grid; grid-template-columns:repeat(3,1fr); align-items:start; gap:20px; }
    .phase-col{ min-width:0; padding:16px; }
    .phase-col .item-card{ font-size:13px; }
  }
  .phase-col{ background:#fbfaf9; border:1px solid var(--line); border-radius:10px; padding:12px; }
  .phase-col .phase-title{ margin-top:0; }
</style>
</head>
<body>
<header>
  <h1>リスクアセスメント表 作成ツール</h1>
  <div class="sub" id="headerSub">質問に答えるだけでリスク項目を自動抽出</div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
</header>
<main id="app"></main>

{"categories": ["忘れ物・準備不足", "電気・感電・停電", "設定・操作ミス", "データ・媒体・バージョン", "旅客・お客様対応", "線路・列車近接", "高所・転倒・落下", "搬入出・重量物", "ハード改造・組付", "環境(天候・夜間・熱中症)", "通信・ネットワーク", "養生・看板・立入禁止"], "questions": {"忘れ物・準備不足": "部材・工具・データ媒体などの準備／忘れ物のリスクはありますか?", "電気・感電・停電": "分電盤・ケーブル・感電・停電など、電気に関わる作業はありますか?", "設定・操作ミス": "機器の設定・スイッチ操作・ローディングなど、操作ミスが起こりうる作業はありますか?", "データ・媒体・バージョン": "データ・媒体・バージョン管理に関わる作業はありますか?", "旅客・お客様対応": "営業中の駅など、旅客・お客様対応が発生する作業はありますか?", "線路・列車近接": "線路・列車運行・ホームドアに近接する作業はありますか?", "高所・転倒・落下": "高所作業・脚立使用など、転倒/落下の危険はありますか?", "搬入出・重量物": "機器の搬入出・重量物の運搬はありますか?", "ハード改造・組付": "ボルト・ビス締結、カバー着脱などハード改造・組付作業はありますか?", "環境(天候・夜間・熱中症)": "夜間作業・悪天候・熱中症のリスクがある作業はありますか?", "通信・ネットワーク": "通信・ネットワーク(LAN等)の設定に関わる作業はありますか?", "養生・看板・立入禁止": "養生・看板設置・立入禁止措置が必要な作業はありますか?"}}
</script>
<script>
const RISK_LIB = JSON.parse(document.getElementById('lib-data').textContent);
const META = JSON.parse(document.getElementById('meta-data').textContent);
const CATEGORIES = META.categories;
const QUESTIONS = META.questions;
const PHASES = ["事前作業","現地作業","現地作業後"];

// ---------- state ----------
const state = {
  screen: 'info',
  info: { office:'相模原営業所', anken:'', koujiban:'', date:new Date().toISOString().slice(0,10), ver:'1', shotyo:'', kanrisha:'', sakusesha:'' },
  selectedPhases: ['事前作業','現地作業','現地作業後'],
  qIndex: 0,
  questionList: [],
  answers: {},
  items: {},
  reviewPhaseIdx: 0
};

function qKey(phase, cat){ return phase+'|'+cat; }

function buildQuestionList(){
  state.questionList = CATEGORIES.map(cat=>({cat}));
}

function levelOf(sev, like, freq){
  const s = (parseInt(sev)||0)+(parseInt(like)||0)+(parseInt(freq)||0);
  if(s>=12) return 'Ⅳ';
  if(s>=8) return 'Ⅲ';
  if(s>=5) return 'Ⅱ';
  if(s>=3) return 'Ⅰ';
  return '';
}
function levelClass(lv){
  return {'Ⅰ':'lvl-I','Ⅱ':'lvl-II','Ⅲ':'lvl-III','Ⅳ':'lvl-IV'}[lv]||'';
}

function makeItemFromLib(libItem){
  return {
    joukyou: libItem.joukyou, risk: libItem.risk, eikyou: libItem.eikyou,
    juutokudo: libItem.juutokudo || '6', kanousei: libItem.kanousei || '2', hindo: libItem.hindo || '1',
    kaihi: libItem.kaihi,
    aJuutokudo: libItem.juutokudo || '6', aKanousei: '1', aHindo: libItem.hindo || '1',
    checked: false
  };
}
function makeBlankItem(prefill){
  return { joukyou: prefill||'', risk:'', eikyou:'', juutokudo:'6', kanousei:'2', hindo:'1', kaihi:'',
    aJuutokudo:'6', aKanousei:'1', aHindo:'1', checked:true };
}

function ensureItemsFor(phase, cat){
  const k = qKey(phase,cat);
  if(!state.items[k]){
    const libItems = (RISK_LIB[phase] && RISK_LIB[phase][cat]) ? RISK_LIB[phase][cat] : [];
    state.items[k] = libItems.map(makeItemFromLib);
  }
  return state.items[k];
}

// ---------- render ----------
const app = document.getElementById('app');
const progressBar = document.getElementById('progressBar');
const headerSub = document.getElementById('headerSub');

function setProgress(pct){ progressBar.style.width = pct+'%'; }

function render(){
  if(state.screen==='info') return renderInfo();
  if(state.screen==='phases') return renderPhases();
  if(state.screen==='quiz') return renderQuiz();
  if(state.screen==='review') return renderReview();
  if(state.screen==='done') return renderDone();
}

function renderInfo(){
  setProgress(5); headerSub.textContent = 'STEP 1 / 4\u3000基本情報';
  app.innerHTML = `
    <div class="card">
      <div class="step-title">案件の基本情報を入力してください</div>
      <label>営業所名</label>
      <input type="text" id="f_office" value="${esc(state.info.office)}">
      <label>作業案件名</label>
      <input type="text" id="f_anken" placeholder="例）〇〇駅 改札機更新工事" value="${esc(state.info.anken)}">
      <label>工事番号（指示書番号）</label>
      <input type="text" id="f_koujiban" placeholder="任意" value="${esc(state.info.koujiban)}">
      <label>作成日付</label>
      <input type="date" id="f_date" value="${esc(state.info.date)}">
      <label>Ver.</label>
      <input type="text" id="f_ver" value="${esc(state.info.ver)}" style="width:80px">
      <label>所長 / 管理者 / 作成者（任意）</label>
      <div style="display:flex; gap:8px;">
        <input type="text" id="f_shotyo" placeholder="所長" value="${esc(state.info.shotyo)}">
        <input type="text" id="f_kanrisha" placeholder="管理者" value="${esc(state.info.kanrisha)}">
        <input type="text" id="f_sakusesha" placeholder="作成者" value="${esc(state.info.sakusesha)}">
      </div>
      <div class="footer-nav">
        <button class="btn btn-primary" onclick="goPhases()">次へ（作業フェーズ選択）</button>
      </div>
    </div>`;
}

function goPhases(){
  state.info.office = document.getElementById('f_office').value;
  state.info.anken = document.getElementById('f_anken').value;
  state.info.koujiban = document.getElementById('f_koujiban').value;
  state.info.date = document.getElementById('f_date').value;
  state.info.ver = document.getElementById('f_ver').value;
  state.info.shotyo = document.getElementById('f_shotyo').value;
  state.info.kanrisha = document.getElementById('f_kanrisha').value;
  state.info.sakusesha = document.getElementById('f_sakusesha').value;
  state.screen = 'phases';
  render();
}

function renderPhases(){
  setProgress(12); headerSub.textContent = 'STEP 2 / 4\u3000対象フェーズ';
  const checks = PHASES.map(p=>{
    const checked = state.selectedPhases.includes(p) ? 'checked' : '';
    return `<label class="phase-check"><input type="checkbox" value="${p}" ${checked} onchange="togglePhase('${p}')"><span>${p}</span></label>`;
  }).join('');
  app.innerHTML = `
    <div class="card">
      <div class="step-title">今回の作業に含まれるフェーズを選んでください</div>
      ${checks}
      <div class="small-note">選んだフェーズごとに、リスクの種類をひとつずつ「はい/いいえ/わからない」で聞いていきます。</div>
      <div class="footer-nav">
        <button class="btn btn-ghost" onclick="state.screen='info'; render();">戻る</button>
        <button class="btn btn-primary" onclick="startQuiz()">質問を始める</button>
      </div>
    </div>`;
}
function togglePhase(p){
  const idx = state.selectedPhases.indexOf(p);
  if(idx>=0) state.selectedPhases.splice(idx,1); else state.selectedPhases.push(p);
}
function startQuiz(){
  if(state.selectedPhases.length===0){ alert('フェーズを1つ以上選んでください'); return; }
  buildQuestionList();
  state.qIndex = 0;
  state.screen = 'quiz';
  render();
}

function renderQuiz(){
  const total = state.questionList.length;
  const pct = 15 + Math.round((state.qIndex/total)*55);
  setProgress(pct);
  headerSub.textContent = `STEP 3 / 4\u3000質問 ${state.qIndex+1} / ${total}`;
  if(state.qIndex >= total){ state.screen='review'; state.reviewPhaseIdx=0; render(); return; }
  const {cat} = state.questionList[state.qIndex];
  const current = state.answers[cat];
  app.innerHTML = `
    <div class="card">
      <div class="qcounter">質問 ${state.qIndex+1} / ${total}</div>
      <div class="q-text">${esc(QUESTIONS[cat])}</div>
      <div class="answer-grid">
        <button class="ans-btn ans-yes ${current==='yes'?'active':''}" onclick="answerQ('yes')">はい</button>
        <button class="ans-btn ans-no ${current==='no'?'active':''}" onclick="answerQ('no')">いいえ</button>
        <button class="ans-btn ans-unk ${current==='unknown'?'active':''}" onclick="answerQ('unknown')">わからない</button>
      </div>
      <div class="footer-nav">
        <button class="btn btn-ghost" onclick="prevQ()">戻る</button>
      </div>
    </div>`;
}
function answerQ(ans){
  const {cat} = state.questionList[state.qIndex];
  state.answers[cat] = ans;
  if(ans==='yes'){
    state.selectedPhases.forEach(phase=> ensureItemsFor(phase,cat));
  }
  if(ans==='unknown'){
    state.selectedPhases.forEach(phase=>{
      const k = qKey(phase,cat);
      if(!state.items[k]) state.items[k] = [];
    });
    const firstPhase = state.selectedPhases[0];
    const k0 = qKey(firstPhase,cat);
    if(!state.items[k0].some(it=>it.__unknownFlag)){
      const blank = makeBlankItem('要現地確認：'+cat);
      blank.__unknownFlag = true;
      blank.risk = '現地確認のうえリスク内容を記載してください';
      blank.eikyou = '未確認のため影響度は現地判断';
      blank.kaihi = '現地確認を行い、必要な対策を追記する';
      state.items[k0].unshift(blank);
    }
  }
  state.qIndex++;
  render();
}
function prevQ(){
  if(state.qIndex===0){ state.screen='phases'; render(); return; }
  state.qIndex--;
  render();
}

function renderReview(){
  setProgress(80); headerSub.textContent = 'STEP 4 / 4\u3000リスク項目の確認・編集';
  const activeCats = CATEGORIES.filter(cat=> ['yes','unknown'].includes(state.answers[cat]));
  const activePhases = activeCats.length>0 ? state.selectedPhases.slice() : [];
  if(activePhases.length===0){
    app.innerHTML = `<div class="card"><p>「はい」または「わからない」と答えた項目がありません。すべて「いいえ」の場合、リスク項目は生成されません。</p>
      <div class="footer-nav"><button class="btn btn-ghost" onclick="state.screen='quiz'; state.qIndex=0; render();">質問をやり直す</button></div></div>`;
    return;
  }
  let html = `<div class="warn-box">候補として表示される項目は過去の類似案件から抽出したものです。内容を必ず現場に合わせて確認・編集してください。チェックを入れた項目だけがExcelに出力されます。</div>`;
  html += `<div class="count-bar" id="countBar"></div>`;
  activePhases.forEach(phase=>{
    html += `<div class="phase-title">${phase}</div>`;
    CATEGORIES.forEach(cat=>{
      const ans = state.answers[cat];
      if(!['yes','unknown'].includes(ans)) return;
      const key = qKey(phase,cat);
      const items = ensureItemsFor(phase,cat);
      html += `<div class="cat-section-title">${cat} ${ans==='unknown'?'<span style="color:#c79a2e;font-size:12px;">(要確認)</span>':''}<span class="cat-count" id="catcnt_${key}"></span></div>`;
      items.forEach((it, idx)=>{
        html += renderItemCard(key, idx, it);
      });
      html += `<button class="btn btn-ghost add-custom" onclick="addCustomItem('${key}')">＋ このカテゴリに項目を追加</button>`;
    });
  });
  html += `<div class="footer-nav">
      <button class="btn btn-ghost" onclick="state.screen='quiz'; state.qIndex=0; render();">質問をやり直す</button>
      <button class="btn btn-primary" onclick="generateExcel()">Excelを作成してダウンロード</button>
    </div>`;
  app.innerHTML = `<div class="card" style="padding:14px;">${html}</div>`;
  updateCounts();
}

function updateCounts(){
  const bar = document.getElementById('countBar');
  if(!bar) return;
  const hdr = document.querySelector('header');
  if(hdr) bar.style.top = (hdr.offsetHeight + 6) + 'px';
  let total = 0;
  const parts = state.selectedPhases.map(phase=>{
    let n = 0;
    CATEGORIES.forEach(cat=>{
      const key = qKey(phase,cat);
      const arr = state.items[key]||[];
      const catN = arr.filter(it=>it.checked).length;
      n += catN;
      const el = document.getElementById('catcnt_'+key);
      if(el){
        el.textContent = catN + '/' + arr.length + ' 選択';
        el.className = 'cat-count' + (catN>0 ? ' has' : '');
      }
    });
    total += n;
    return `<span class="cnt">${phase}<b>${n}</b>件</span>`;
  });
  bar.innerHTML = parts.join('') + `<span class="cnt">合計<b>${total}</b>件</span>`;
}

function renderItemCard(key, idx, it){
  const lv = levelOf(it.juutokudo, it.kanousei, it.hindo);
  const lvA = levelOf(it.aJuutokudo, it.aKanousei, it.aHindo);
  return `
  <div class="item-card ${it.checked?'checked':''}" id="card_${key}_${idx}">
    <div class="item-head">
      <input type="checkbox" ${it.checked?'checked':''} onchange="toggleItem('${key}',${idx})">
      <div style="flex:1">
        <div class="item-risk">${esc(it.risk||'(内容を入力)')} <span class="level-badge ${levelClass(lv)}">${lv||'-'}</span></div>
        <div class="item-detail">${esc(it.joukyou)}${it.eikyou? ' ／ 影響: '+esc(it.eikyou):''}</div>
      </div>
    </div>
    <div class="item-edit">
      <label>作業状況（何の作業のときに）</label>
      <input type="text" value="${esc(it.joukyou)}" oninput="updateItem('${key}',${idx},'joukyou',this.value)">
      <label>想定されるリスク</label>
      <textarea oninput="updateItem('${key}',${idx},'risk',this.value)">${esc(it.risk)}</textarea>
      <label>想定される影響</label>
      <textarea oninput="updateItem('${key}',${idx},'eikyou',this.value)">${esc(it.eikyou)}</textarea>
      <label>事故回避のための手法（対策）</label>
      <textarea oninput="updateItem('${key}',${idx},'kaihi',this.value)">${esc(it.kaihi)}</textarea>
      <label>対策前の評価</label>
      <div class="level-row">
        ${sevSelect(key,idx,'juutokudo',it.juutokudo)}
        ${likeSelect(key,idx,'kanousei',it.kanousei)}
        ${freqSelect(key,idx,'hindo',it.hindo)}
        <span class="level-badge ${levelClass(lv)}">Lv ${lv||'-'}</span>
      </div>
      <label>対策後の評価</label>
      <div class="level-row">
        ${sevSelect(key,idx,'aJuutokudo',it.aJuutokudo)}
        ${likeSelect(key,idx,'aKanousei',it.aKanousei)}
        ${freqSelect(key,idx,'aHindo',it.aHindo)}
        <span class="level-badge ${levelClass(lvA)}">Lv ${lvA||'-'}</span>
      </div>
    </div>
  </div>`;
}
function sevSelect(key,idx,field,val){
  const opts = [['1','1(些細)'],['3','3(軽微)'],['6','6(重・中)'],['10','10(重大)']];
  return `<select onchange="updateItem('${key}',${idx},'${field}',this.value)">${opts.map(o=>`<option value="${o[0]}" ${String(val)===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`;
}
function likeSelect(key,idx,field,val){
  const opts = [['1','1(ほぼない)'],['2','2(低い)'],['4','4(高い)'],['6','6(確実)']];
  return `<select onchange="updateItem('${key}',${idx},'${field}',this.value)">${opts.map(o=>`<option value="${o[0]}" ${String(val)===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`;
}
function freqSelect(key,idx,field,val){
  const opts = [['1','1(稀)'],['2','2(時々)'],['4','4(頻繁)']];
  return `<select onchange="updateItem('${key}',${idx},'${field}',this.value)">${opts.map(o=>`<option value="${o[0]}" ${String(val)===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`;
}
function toggleItem(key, idx){
  state.items[key][idx].checked = !state.items[key][idx].checked;
  document.getElementById(`card_${key}_${idx}`).classList.toggle('checked');
  updateCounts();
}
function updateItem(key, idx, field, val){
  state.items[key][idx][field] = val;
  const card = document.getElementById(`card_${key}_${idx}`);
  if(!card) return;
  const it = state.items[key][idx];
  const lv = levelOf(it.juutokudo, it.kanousei, it.hindo);
  const lvA = levelOf(it.aJuutokudo, it.aKanousei, it.aHindo);
  const badges = card.querySelectorAll('.level-badge');
  if(badges[0]){ badges[0].textContent = lv||'-'; badges[0].className = 'level-badge '+levelClass(lv); }
  if(badges[1]){ badges[1].textContent = 'Lv '+(lvA||'-'); badges[1].className = 'level-badge '+levelClass(lvA); }
  if(field==='risk' || field==='joukyou' || field==='eikyou'){
    const riskEl = card.querySelector('.item-risk');
    const detailEl = card.querySelector('.item-detail');
    if(field==='risk' && riskEl) riskEl.childNodes[0].textContent = (it.risk||'(内容を入力)')+' ';
    if(detailEl) detailEl.textContent = it.joukyou + (it.eikyou? ' ／ 影響: '+it.eikyou : '');
  }
}
function addCustomItem(key){
  if(!state.items[key]) state.items[key] = [];
  state.items[key].push(makeBlankItem(''));
  render();
}

function renderDone(){
  setProgress(100); headerSub.textContent = '完了';
  app.innerHTML = `<div class="card">
    <div class="q-text">Excelファイルを出力しました</div>
    <p class="small-note">ダウンロードフォルダを確認してください。内容は必ず社内フォーマットのチェック・承認フローに従って確認してください。</p>
    <div class="footer-nav">
      <button class="btn btn-ghost" onclick="state.screen='review'; render();">編集画面に戻る</button>
      <button class="btn btn-primary" onclick="location.reload()">最初からやり直す</button>
    </div>
  </div>`;
}

function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ---------- Excel export (template-based, byte-faithful to company format) ----------
// Template-based xlsx builder: edits sheet1.xml of the company template in place.
// Works in browser (with JSZip global) and node (module.exports).

function xmlEsc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\r\n/g,'\n');
}

// Extract a full <row r="N" ...>...</row> block
function getRow(xml, n){
  const re = new RegExp('<row r="'+n+'"[^>]*>[\\s\\S]*?</row>');
  const m = xml.match(re);
  if(!m) throw new Error('row '+n+' not found');
  return m[0];
}

// Rewrite one template row: renumber to newNum, clear values, inject new cell content.
// values: { A:{type,val}, ... }  type: 'inline' | 'num' | 'formula'
function buildRow(tplRow, oldNum, newNum, values){
  // renumber row attr
  let row = tplRow.replace(new RegExp('^<row r="'+oldNum+'"'), '<row r="'+newNum+'"');
  // process each cell
  row = row.replace(/<c r="([A-Z]+)(\d+)"([^>]*?)(\/>|>([\s\S]*?)<\/c>)/g, function(_, col, rn, attrs, closer){
    // strip t attr from attrs (we set our own)
    let cleanAttrs = attrs.replace(/\s+t="[^"]*"/g, '');
    const ref = col + newNum;
    const v = values[col];
    if(!v){
      return '<c r="'+ref+'"'+cleanAttrs+'/>';
    }
    if(v.type==='num'){
      return '<c r="'+ref+'"'+cleanAttrs+'><v>'+v.val+'</v></c>';
    }
    if(v.type==='formula'){
      return '<c r="'+ref+'"'+cleanAttrs+' t="str"><f>'+v.val+'</f></c>';
    }
    // inline string
    return '<c r="'+ref+'"'+cleanAttrs+' t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(v.val)+'</t></is></c>';
  });
  return row;
}

// Set a header cell value (inline string) in an existing row without renumbering
function setCellInline(xml, ref, text){
  const re = new RegExp('<c r="'+ref+'"([^>]*?)(\\/>|>[\\s\\S]*?<\\/c>)');
  return xml.replace(re, function(_, attrs){
    const cleanAttrs = attrs.replace(/\s+t="[^"]*"/g, '');
    return '<c r="'+ref+'"'+cleanAttrs+' t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(text)+'</t></is></c>';
  });
}

function lvFormula(rowNum, cols){ // cols: ['G','I'] or ['N','P']
  const a=cols[0], b=cols[1];
  return 'IF(SUM('+a+rowNum+':'+b+rowNum+')&gt;=12,"Ⅳ",IF(SUM('+a+rowNum+':'+b+rowNum+')&gt;=8,"Ⅲ",IF(SUM('+a+rowNum+':'+b+rowNum+')&gt;=5,"Ⅱ",IF(SUM('+a+rowNum+':'+b+rowNum+')&gt;=3,"Ⅰ",""))))';
}

// Main: rebuild sheet1.xml
// blocks: [{phase:'事前作業', items:[{joukyou,risk,eikyou,juutokudo,kanousei,hindo,kaihi,aJuutokudo,aKanousei,aHindo}]}, ...]
// info: {office, anken, koujiban, dateText, ver, shotyo, kanrisha, sakusesha}
function rebuildSheetXml(xml, blocks, info){
  // --- header values ---
  xml = setCellInline(xml, 'A1', info.office + '\u3000リスクアセスメント表（2024年6月17日以降作業に適用）');
  xml = setCellInline(xml, 'L1', info.dateText);
  xml = setCellInline(xml, 'P1', 'Ｖｅｒ．' + info.ver);
  xml = setCellInline(xml, 'D2', info.anken);
  xml = setCellInline(xml, 'D4', info.koujiban || '');
  if(info.shotyo) xml = setCellInline(xml, 'L3', info.shotyo);
  if(info.kanrisha) xml = setCellInline(xml, 'N3', info.kanrisha);
  if(info.sakusesha) xml = setCellInline(xml, 'P3', info.sakusesha);

  // --- capture template pieces ---
  const blockTemplates = [
    {first: getRow(xml,10), mid: getRow(xml,11), last: getRow(xml,12), nums:[10,11,12]},
    {first: getRow(xml,13), mid: getRow(xml,14), last: getRow(xml,15), nums:[13,14,15]},
    {first: getRow(xml,16), mid: getRow(xml,17), last: getRow(xml,18), nums:[16,17,18]},
  ];
  const tailRows = [19,20,21,22,23].map(n=>({n, xml: getRow(xml,n)}));

  // --- build data rows ---
  let newRows = [];
  let newMerges = [];
  let r = 10;
  const activeBlocks = blocks.filter(b=>b.items.length>0);
  activeBlocks.forEach((block, bi)=>{
    const tpl = blockTemplates[Math.min(bi, 2)];
    // pad single-item block with one empty row so the block keeps a proper bottom border
    const items = block.items.slice();
    const rowsInBlock = Math.max(items.length, 2);
    const startR = r;
    for(let i=0;i<rowsInBlock;i++){
      const isFirst = i===0, isLast = i===rowsInBlock-1;
      const t = isFirst ? tpl.first : (isLast ? tpl.last : tpl.mid);
      const oldNum = isFirst ? tpl.nums[0] : (isLast ? tpl.nums[2] : tpl.nums[1]);
      const it = items[i];
      const values = {};
      if(isFirst){ values.B = {type:'inline', val: block.phase}; }
      if(it){
        values.A = {type:'inline', val: (bi+1)+'-'+(i+1)};
        values.D = {type:'inline', val: it.joukyou};
        values.E = {type:'inline', val: it.risk};
        values.F = {type:'inline', val: it.eikyou};
        values.G = {type:'num', val: Number(it.juutokudo)||0};
        values.H = {type:'num', val: Number(it.kanousei)||0};
        values.I = {type:'num', val: Number(it.hindo)||0};
        values.J = {type:'formula', val: lvFormula(r, ['G','I'])};
        values.K = {type:'inline', val: it.kaihi};
        values.N = {type:'num', val: Number(it.aJuutokudo)||0};
        values.O = {type:'num', val: Number(it.aKanousei)||0};
        values.P = {type:'num', val: Number(it.aHindo)||0};
        values.Q = {type:'formula', val: lvFormula(r, ['N','P'])};
      } else {
        // empty pad row still carries the level formulas like the original template
        values.J = {type:'formula', val: lvFormula(r, ['G','I'])};
        values.Q = {type:'formula', val: lvFormula(r, ['N','P'])};
      }
      newRows.push(buildRow(t, oldNum, r, values));
      newMerges.push('K'+r+':M'+r);
      r++;
    }
    newMerges.push('B'+startR+':C'+(r-1));
  });
  if(newRows.length===0){
    // no items at all: keep one empty block
    const tpl = blockTemplates[0];
    newRows.push(buildRow(tpl.first, 10, 10, {J:{type:'formula',val:lvFormula(10,['G','I'])},Q:{type:'formula',val:lvFormula(10,['N','P'])}}));
    newRows.push(buildRow(tpl.last, 12, 11, {J:{type:'formula',val:lvFormula(11,['G','I'])},Q:{type:'formula',val:lvFormula(11,['N','P'])}}));
    newMerges.push('K10:M10','K11:M11','B10:C11');
    r = 12;
  }

  const delta = r - 19; // tail originally starts at 19

  // --- renumber tail rows ---
  const tailXml = tailRows.map(({n, xml: rowXml})=>{
    const newN = n + delta;
    let out = rowXml.replace(new RegExp('^<row r="'+n+'"'), '<row r="'+newN+'"');
    out = out.replace(new RegExp('<c r="([A-Z]+)'+n+'"','g'), '<c r="$1'+newN+'"');
    return out;
  }).join('');

  // --- splice sheetData: keep rows 1-9, then new rows, then tail ---
  const sdStart = xml.indexOf('<sheetData>');
  const sdEnd = xml.indexOf('</sheetData>');
  const sheetDataInner = xml.slice(sdStart+11, sdEnd);
  // head = everything up to row 10
  const row10idx = sheetDataInner.indexOf('<row r="10"');
  const headRows = sheetDataInner.slice(0, row10idx);
  const newSheetData = '<sheetData>' + headRows + newRows.join('') + tailXml + '</sheetData>';
  xml = xml.slice(0, sdStart) + newSheetData + xml.slice(sdEnd+12);

  // --- rebuild mergeCells: keep merges above row 10, replace data-area merges, shift tail merges ---
  xml = xml.replace(/<mergeCells count="\d+">([\s\S]*?)<\/mergeCells>/, function(_, inner){
    const refs = [];
    const re = /<mergeCell ref="([A-Z]+)(\d+):([A-Z]+)(\d+)"\/>/g;
    let m;
    while((m = re.exec(inner))){
      const [_, c1, r1, c2, r2] = m;
      const R1 = parseInt(r1), R2 = parseInt(r2);
      if(R2 <= 9){ refs.push(c1+R1+':'+c2+R2); }        // header merges keep
      else if(R1 >= 19){ refs.push(c1+(R1+delta)+':'+c2+(R2+delta)); } // tail merges shift
      // data-area merges (10-18) dropped - replaced by newMerges
    }
    newMerges.forEach(x=>refs.push(x));
    return '<mergeCells count="'+refs.length+'">' + refs.map(x=>'<mergeCell ref="'+x+'"/>').join('') + '</mergeCells>';
  });

  // --- dimension ---
  xml = xml.replace(/<dimension ref="A1:Q\d+"\/>/, '<dimension ref="A1:Q'+(23+delta)+'"/>');

  return {xml, delta};
}

// Full workbook processing given JSZip instance loaded with template
async function fillTemplate(zip, blocks, info){
  let sheet = await zip.file('xl/worksheets/sheet1.xml').async('string');
  const {xml, delta} = rebuildSheetXml(sheet, blocks, info);
  zip.file('xl/worksheets/sheet1.xml', xml);

  // workbook.xml: update print area for ver3 (localSheetId=0), force recalc
  let wb = await zip.file('xl/workbook.xml').async('string');
  wb = wb.replace(/(<definedName name="_xlnm\.Print_Area" localSheetId="0">[^<]*\$A\$1:\$Q\$)\d+(<\/definedName>)/, '$1'+(22+delta)+'$2');
  wb = wb.replace(/<calcPr calcId="\d+"\/>/, '<calcPr calcId="191029" fullCalcOnLoad="1"/>');
  zip.file('xl/workbook.xml', wb);

  // remove calcChain (stale references would trigger Excel repair)
  zip.remove('xl/calcChain.xml');
  let rels = await zip.file('xl/_rels/workbook.xml.rels').async('string');
  rels = rels.replace(/<Relationship [^>]*Target="calcChain\.xml"[^>]*\/>/, '');
  zip.file('xl/_rels/workbook.xml.rels', rels);
  let ct = await zip.file('[Content_Types].xml').async('string');
  ct = ct.replace(/<Override [^>]*calcChain\.xml[^>]*\/>/, '');
  zip.file('[Content_Types].xml', ct);

  return zip;
}




function toJpDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  return y + '年 ' + m + '月' + d + '日';
}

async function generateExcel(){
  const b64 = document.getElementById('tpl-data').textContent.trim();
  const zip = await JSZip.loadAsync(b64, {base64:true});

  const blocks = [];
  state.selectedPhases.forEach(phase=>{
    const items = [];
    CATEGORIES.forEach(cat=>{
      const ans = state.answers[cat];
      if(!['yes','unknown'].includes(ans)) return;
      (state.items[qKey(phase,cat)]||[]).filter(it=>it.checked).forEach(it=>{
        items.push({
          joukyou: it.joukyou, risk: it.risk, eikyou: it.eikyou,
          juutokudo: it.juutokudo, kanousei: it.kanousei, hindo: it.hindo,
          kaihi: it.kaihi,
          aJuutokudo: it.aJuutokudo, aKanousei: it.aKanousei, aHindo: it.aHindo
        });
      });
    });
    if(items.length>0) blocks.push({phase, items});
  });

  const info = {
    office: state.info.office || '相模原営業所',
    anken: state.info.anken || '',
    koujiban: state.info.koujiban || '',
    dateText: toJpDate(state.info.date),
    ver: state.info.ver || '1',
    shotyo: state.info.shotyo, kanrisha: state.info.kanrisha, sakusesha: state.info.sakusesha
  };

  await fillTemplate(zip, blocks, info);
  const blob = await zip.generateAsync({type:'blob', compression:'DEFLATE',
    mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const fname = 'リスクアセスメント表_' + (state.info.anken||'無題').replace(/[\\/:*?"<>|]/g,'_') + '_' + state.info.date + '.xlsx';
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fname; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1000);
  state.screen = 'done';
  render();
}
